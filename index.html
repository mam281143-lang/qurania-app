<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json" />
<title>Qurania — Apprends le Coran en t'amusant</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg:#0a0e17; --panel:#121a28; --panel-2:#1a2333; --border:#2a3548;
    --accent:#8b5cf6; --accent-light:#a78bfa; --accent-dark:#6d28d9;
    --gold:#fbbf24; --gold-light:#fcd34d; --teal:#14b8a6;
    --text:#e8eaf0; --text-dim:#8892a7;
    --success:#10b981; --success-light:#34d399; --error:#ef4444; --warn:#f59e0b;
    --shadow:rgba(0,0,0,0.5);
}
body.light {
    --bg:#f5f7fb; --panel:#ffffff; --panel-2:#f1f5f9; --border:#e2e8f0;
    --text:#0f172a; --text-dim:#64748b; --shadow:rgba(15,23,42,0.12);
    background: radial-gradient(ellipse at top, #eef2ff 0%, #f5f7fb 60%);
}
body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #1a1f35 0%, #0a0e17 60%);
    color: var(--text); min-height: 100vh; padding-bottom: 3rem; line-height: 1.5;
    transition: background 0.3s, color 0.3s; overflow-x: hidden;
}
.container { max-width: 1100px; margin: 0 auto; padding: 1rem; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes wiggle { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pulse-glow { 0%,100% { filter: drop-shadow(0 0 4px currentColor); } 50% { filter: drop-shadow(0 0 14px currentColor); } }
@keyframes float-up { 0% { transform: translate(-50%, 0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -120px) scale(1.4); opacity: 0; } }
@keyframes flame-flicker { 0%,100% { transform: scale(1) rotate(-3deg); filter: brightness(1); } 50% { transform: scale(1.15) rotate(3deg); filter: brightness(1.3); } }
@keyframes star-pop { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.3) rotate(15deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes gradient-move { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

.app-header { text-align: center; padding: 1.5rem 0 1rem; position: relative; }
.app-header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--gold), var(--accent-light), var(--teal), var(--gold));
    background-size: 300% 300%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; animation: gradient-move 6s ease infinite; }
.app-header p { color: var(--text-dim); font-size: 0.95rem; margin-top: 0.3rem; font-style: italic; }

.mascot-wrap { display: flex; align-items: center; justify-content: center; gap: 0.8rem; margin-top: 0.8rem; flex-wrap: wrap; }
.mascot { width: 60px; height: 60px; color: var(--gold); animation: bounce 2s ease-in-out infinite; filter: drop-shadow(0 4px 8px rgba(251,191,36,0.4)); }
.mascot .eye { animation: blink 4s ease-in-out infinite; transform-origin: center; }
.mascot-bubble { background: var(--panel); border: 2px solid var(--gold); border-radius: 16px; padding: 0.5rem 0.9rem; font-size: 0.8rem; color: var(--text); max-width: 220px; text-align: left; position: relative; animation: popIn 0.4s; }
.mascot-bubble::before { content: ""; position: absolute; left: -10px; top: 50%; transform: translateY(-50%); border: 6px solid transparent; border-right-color: var(--gold); }

.user-stats { display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; margin-top: 1rem; }
.stat-badge { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--text); transition: transform 0.2s; }
.stat-badge:hover { transform: scale(1.05); }
.stat-badge strong { color: var(--gold); font-variant-numeric: tabular-nums; }
.stat-badge.streak-flame .flame { display: inline-block; animation: flame-flicker 1s ease-in-out infinite; }

.nav-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin: 1.5rem 0; }
.nav-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.95rem; border-radius: 10px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; font-weight: 500; font-family: inherit; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent-light); transform: translateY(-2px); }
.nav-btn.active { background: var(--accent-dark); color: #fff; border-color: var(--accent); box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4); }

.view { display: none; animation: fadeIn 0.3s ease; }
.view.active { display: block; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1.3rem; margin-bottom: 1rem; }
.card-title { font-size: 1.1rem; font-weight: 600; color: var(--accent-light); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
.section-title { font-size: 1.4rem; font-weight: 700; color: var(--text); margin: 1.5rem 0 1rem; text-align: center; }
.section-subtitle { text-align: center; color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1.5rem; }

.btn { background: var(--accent-dark); color: #fff; border: none; padding: 0.8rem 1.5rem; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn:hover:not(:disabled) { background: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(139,92,246,0.35); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-gold { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #0a0e17; }
.btn-gold:hover:not(:disabled) { background: linear-gradient(135deg, var(--gold-light), var(--gold)); box-shadow: 0 6px 22px rgba(251,191,36,0.5); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }
.btn-danger { background: var(--error); color: #fff; }
.btn-sm { padding: 0.5rem 0.9rem; font-size: 0.8rem; }
.btn-xs { padding: 0.3rem 0.65rem; font-size: 0.72rem; }

.progress-bar { background: rgba(0,0,0,0.3); border-radius: 8px; height: 10px; overflow: hidden; border: 1px solid var(--border); }
body.light .progress-bar { background: #e2e8f0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width 0.6s ease-out; border-radius: 8px; background-size: 200% 100%; animation: gradient-move 3s ease infinite; }
.progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.3rem; }

.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.dash-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem; text-align: center; transition: transform 0.2s; }
.dash-card:hover { transform: translateY(-3px); }
.dash-card .icon { font-size: 2rem; margin-bottom: 0.5rem; display: inline-block; transition: transform 0.3s; }
.dash-card:hover .icon { transform: scale(1.2) rotate(-8deg); }
.dash-card .label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.dash-card .value { font-size: 1.7rem; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; margin-top: 0.2rem; }
.dash-card .sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.3rem; }

/* BOUSSOLE QIBLA */
.compass-container { background: linear-gradient(135deg, var(--panel), var(--panel-2)); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; position: relative; overflow: hidden; }
.compass-dial { width: 250px; height: 250px; margin: 0 auto; position: relative; border-radius: 50%; background: radial-gradient(circle, #1a2333 0%, #0f1521 100%); border: 4px solid var(--border); box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 20px rgba(139,92,246,0.2); display: flex; align-items: center; justify-content: center; }
.compass-dial::after { content: ''; position: absolute; top: 5px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 15px solid var(--error); z-index: 10; }
.compass-needle { width: 10px; height: 200px; position: absolute; transition: transform 0.3s ease-out; z-index: 5; }
.compass-needle::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 100px; background: linear-gradient(to bottom, var(--gold), #f59e0b); border-radius: 5px 5px 0 0; box-shadow: 0 0 10px rgba(251,191,36,0.5); }
.compass-needle::after { content: ''; position: absolute; bottom: 0; left: 0; width: 10px; height: 100px; background: linear-gradient(to top, var(--accent-dark), #4c1d95); border-radius: 0 0 5px 5px; }
.compass-kaaba { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; z-index: 6; }
.compass-labels { position: absolute; inset: 0; font-size: 0.9rem; font-weight: 700; color: var(--text-dim); }
.compass-labels span { position: absolute; }
.compass-labels .n { top: 10px; left: 50%; transform: translateX(-50%); color: var(--error); font-size: 1.2rem; }
.compass-labels .s { bottom: 10px; left: 50%; transform: translateX(-50%); }
.compass-labels .e { top: 50%; right: 15px; transform: translateY(-50%); }
.compass-labels .w { top: 50%; left: 15px; transform: translateY(-50%); }
.compass-info { margin-top: 1rem; font-size: 0.9rem; color: var(--text); font-weight: 600; }
.compass-info span { color: var(--gold); }

/* FIGURES SVG */
.prayer-positions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; }
.position-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem 0.4rem; text-align: center; transition: all 0.2s; cursor: pointer; }
.position-tile:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 8px 22px rgba(251,191,36,0.2); }
.position-tile .pt-figure { height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.4rem; }
.position-tile .pt-figure svg { height: 100%; max-width: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
.position-tile .pt-name { font-size: 0.85rem; font-weight: 600; color: var(--gold); }
.position-tile .pt-ar { font-family: 'Amiri', serif; font-size: 0.85rem; color: var(--text-dim); margin-top: 0.15rem; }

.practice-box { background: linear-gradient(135deg, rgba(139,92,246,0.14), rgba(251,191,36,0.06)); border: 1px solid var(--accent); border-radius: 16px; padding: 1.5rem; text-align: center; }
.practice-figure { max-width: 220px; height: 260px; margin: 0 auto 0.8rem; animation: pulse-glow 3s ease-in-out infinite; }
.practice-figure svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)); }
.step-figure-sm { width: 130px; height: 150px; background: var(--panel-2); border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0.4rem; }
.step-figure-sm svg { width: 100%; height: 100%; max-height: 140px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }

.step-list { display: flex; flex-direction: column; gap: 0.9rem; }
.step-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; display: grid; grid-template-columns: 130px 1fr; gap: 1rem; align-items: center; transition: all 0.2s; }
.step-card:hover { border-color: var(--accent); }
.step-card.done { border-color: var(--success); background: rgba(16,185,129,0.04); }
.step-body .step-num { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.step-body .step-title { font-size: 1.02rem; font-weight: 700; color: var(--gold); margin: 0.15rem 0; }
.step-body .step-ar { font-family: 'Amiri', serif; color: var(--accent-light); font-size: 0.95rem; }
.step-body .step-desc { color: var(--text); font-size: 0.82rem; margin: 0.4rem 0; line-height: 1.5; }
.step-recite { background: var(--panel-2); border-radius: 8px; padding: 0.55rem 0.75rem; margin-top: 0.4rem; }
.step-recite .sr-ar { font-family: 'Amiri', serif; font-size: 1.15rem; color: var(--gold); direction: rtl; text-align: right; line-height: 1.8; }
.step-recite .sr-tr { font-style: italic; color: var(--accent-light); font-size: 0.72rem; margin-top: 0.25rem; }
.step-recite .sr-fr { color: var(--text); font-size: 0.78rem; margin-top: 0.15rem; }
.step-actions { display: flex; gap: 0.35rem; margin-top: 0.4rem; flex-wrap: wrap; }

/* Reste du CSS existant... */
.verse-day { background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(251,191,36,0.1)); border: 1px solid var(--accent); border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; position: relative; overflow: hidden; }
.verse-day .ar { font-family: 'Amiri', serif; font-size: 1.9rem; color: var(--gold); direction: rtl; line-height: 1.8; margin-bottom: 0.8rem; }
.verse-day .tr { font-style: italic; color: var(--accent-light); font-size: 0.85rem; margin-bottom: 0.4rem; }
.verse-day .fr { color: var(--text); font-size: 0.95rem; }
.verse-day .ref { color: var(--text-dim); font-size: 0.78rem; margin-top: 0.6rem; }
.alphabet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 0.7rem; }
.letter-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 0.4rem; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
.letter-tile:hover { border-color: var(--accent); transform: translateY(-4px) scale(1.03); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.25); }
.letter-tile.learned { border-color: var(--success); background: rgba(16, 185, 129, 0.08); }
.letter-tile.learned::after { content: "✓"; position: absolute; top: 4px; right: 6px; color: var(--success); font-size: 0.8rem; font-weight: 700; animation: star-pop 0.5s ease-out; }
.letter-tile .ar { font-family: 'Amiri', 'Traditional Arabic', serif; font-size: 2rem; color: var(--gold); line-height: 1.2; }
.letter-tile .name { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.3rem; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100; overflow-y: auto; backdrop-filter: blur(4px); }
.modal-overlay.visible { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; max-width: 460px; width: 100%; text-align: center; animation: popIn 0.25s; margin: auto; max-height: 92vh; overflow-y: auto; }
.modal .big-ar { font-family: 'Amiri', serif; font-size: 4.5rem; color: var(--gold); line-height: 1; margin-bottom: 0.3rem; }
.modal .modal-name { font-size: 1.3rem; font-weight: 700; color: var(--text); }
.modal .modal-sound { color: var(--text-dim); font-style: italic; margin: 0.3rem 0 0.6rem; font-size: 0.9rem; }
.modal .modal-example { background: var(--panel-2); border-radius: 10px; padding: 0.7rem; margin: 0.7rem 0; font-size: 0.85rem; }
.modal-actions { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; margin-top: 0.8rem; }
.forms-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin: 0.6rem 0; }
.form-item { background: var(--panel-2); border-radius: 8px; padding: 0.5rem 0.2rem; }
.form-item .f-label { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.form-item .f-ar { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--gold); margin-top: 0.2rem; }
.trace-wrapper { position: relative; width: 240px; height: 240px; margin: 0.8rem auto 0.4rem; background: var(--panel-2); border-radius: 12px; border: 1px dashed var(--border); }
.trace-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Amiri', serif; font-size: 170px; color: rgba(251,191,36,0.2); pointer-events: none; user-select: none; }
#traceCanvas { position: relative; cursor: crosshair; touch-action: none; border-radius: 12px; }
.vocab-controls { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
.flashcard { background: linear-gradient(135deg, var(--panel), var(--panel-2)); border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem 1.5rem; text-align: center; min-height: 220px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; transition: all 0.2s; margin: 0 auto; max-width: 500px; user-select: none; }
.flashcard:hover { transform: translateY(-2px) scale(1.01); border-color: var(--accent); }
.flashcard .ar-word { font-family: 'Amiri', serif; font-size: 3rem; color: var(--gold); line-height: 1.3; }
.flashcard .translit { font-style: italic; color: var(--text-dim); margin-top: 0.5rem; font-size: 1rem; }
.flashcard .translation { font-size: 1.4rem; color: var(--success-light); margin-top: 1rem; font-weight: 600; display: none; }
.flashcard.revealed .translation { display: block; animation: popIn 0.3s; }
.flashcard .hint { color: var(--text-dim); font-size: 0.8rem; margin-top: 1rem; }
.vocab-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.7rem; }
.vocab-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.9rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.vocab-item .ar { font-family: 'Amiri', serif; font-size: 1.3rem; color: var(--gold); }
.vocab-item .fr { font-size: 0.85rem; color: var(--text); }
.vocab-item .pron { font-size: 0.7rem; color: var(--text-dim); font-style: italic; }
.search-input { width: 100%; max-width: 400px; margin: 0 auto 1rem; display: block; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 0.7rem 1rem; border-radius: 10px; font-size: 0.9rem; font-family: inherit; }
.search-input:focus { outline: none; border-color: var(--accent); }
.surah-list { display: flex; flex-direction: column; gap: 0.8rem; }
.surah-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color 0.2s; }
.surah-header { padding: 1rem 1.2rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 1rem; transition: background 0.2s; flex-wrap: wrap; }
.surah-header:hover { background: var(--panel-2); }
.surah-header .surah-name { font-size: 1.05rem; font-weight: 600; color: var(--text); }
.surah-header .surah-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.2rem; }
.surah-header .surah-ar { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--gold); }
.surah-body { display: none; padding: 0 1.2rem 1.2rem; }
.surah-card.open .surah-body { display: block; animation: fadeIn 0.3s; }
.verse { padding: 0.8rem 0; border-top: 1px solid var(--border); }
.verse:first-child { border-top: none; }
.verse-ar { font-family: 'Amiri', serif; font-size: 1.6rem; color: var(--gold); direction: rtl; text-align: right; line-height: 2; margin: 0.5rem 0; padding: 0.5rem 0.8rem; background: var(--panel-2); border-radius: 8px; }
.verse-tr { font-style: italic; color: var(--accent-light); font-size: 0.85rem; margin: 0.3rem 0; }
.verse-fr { color: var(--text); font-size: 0.9rem; }
.audio-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--accent-light); padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; margin-top: 0.4rem; transition: all 0.2s; font-family: inherit; }
.audio-btn:hover { border-color: var(--accent); color: var(--gold); transform: scale(1.05); }
.recit-list { display: flex; flex-direction: column; gap: 0.7rem; }
.recit-card { background: linear-gradient(135deg, var(--panel), var(--panel-2)); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem 1.1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; transition: all 0.3s; cursor: pointer; font-family: inherit; color: var(--text); text-align: left; width: 100%; }
.recit-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.recit-card.playing { border-color: var(--gold); box-shadow: 0 0 22px rgba(251, 191, 36, 0.35); animation: pulse-glow 2s ease-in-out infinite; }
.recit-info { flex: 1; min-width: 0; }
.recit-name { font-size: 1rem; font-weight: 700; color: var(--gold); }
.recit-ar { font-family: 'Amiri', serif; font-size: 1.2rem; color: var(--text-dim); margin-top: 0.1rem; direction: rtl; }
.recit-meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.2rem; }
.recit-btn { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #f59e0b); color: #0a0e17; font-size: 1.3rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.recit-card:hover .recit-btn { transform: scale(1.1); box-shadow: 0 4px 16px rgba(251, 191, 36, 0.5); }

let currentAudioEl = null;
let currentAudioId = null;

function stopCurrentAudio() {
    if (currentAudioEl) { try { currentAudioEl.pause(); } catch(e){} }
    currentAudioEl = null;
    currentAudioId = null;
    updateAudioButtons();
}

function playSurahAudio(id) {
    if (currentAudioId === id && currentAudioEl) { stopCurrentAudio(); return; }
    stopCurrentAudio();
    const recit = AUDIO_RECITATIONS[id];
    if (!recit) return;
    currentAudioId = id;
    currentAudioEl = new Audio(recit.url);
    currentAudioEl.play().then(() => {
        showToast('🎧 Lecture : ' + recit.name);
        updateAudioButtons();
    }).catch(() => {
        showToast('⚠️ Audio indisponible — vérifie ta connexion');
        stopCurrentAudio();
    });
    currentAudioEl.addEventListener('ended', () => {
        currentAudioEl = null;
        currentAudioId = null;
        updateAudioButtons();
    }, { once: true });
    updateAudioButtons();
}

function playSequence(ids) {
    stopCurrentAudio();
    if (!ids || !ids.length) return;
    let i = 0;
    const playNext = () => {
        if (i >= ids.length) {
            currentAudioEl = null;
            currentAudioId = null;
            updateAudioButtons();
            showToast('✅ Récitation terminée — Masha Allah !');
            return;
        }
        const id = ids[i++];
        const recit = AUDIO_RECITATIONS[id];
        if (!recit) { playNext(); return; }
        currentAudioId = id;
        currentAudioEl = new Audio(recit.url);
        currentAudioEl.addEventListener('ended', playNext, { once: true });
        currentAudioEl.play().then(() => {
            updateAudioButtons();
            showToast('🎧 ' + recit.name + ' (' + i + '/' + ids.length + ')');
        }).catch(() => {
            showToast('⚠️ Audio indisponible');
            currentAudioEl = null;
            currentAudioId = null;
            updateAudioButtons();
        });
        updateAudioButtons();
    };
    playNext();
}

function updateAudioButtons() {
    document.querySelectorAll('[data-audio-id]').forEach(el => {
        const id = el.getAttribute('data-audio-id');
        el.classList.toggle('playing', currentAudioId === id);
        const icon = el.querySelector('.recit-icon');
        if (icon) icon.textContent = (currentAudioId === id) ? '⏹' : '🎧';
    });
}

        const s = JSON.parse(raw);
        return { ...defaultState, ...s,

            vocabSRS: s.vocabSRS || {},

function updateStreak() {

function levelFromXP(xp) {
    if (xp < 100) return 1;
    if (xp < 300) return 2;
    if (xp < 600) return 3;
    if (xp < 1000) return 4;
    if (xp < 1500) return 5;
    return 6 + Math.floor((xp - 1500) / 500);
}
function xpForNextLevel(xp) {
    const l = levelFromXP(xp);
    const t = [0, 100, 300, 600, 1000, 1500];
    return l <= 5 ? t[l] : 1500 + (l - 5) * 500;
}
function xpForCurrentLevel(xp) {
    const l = levelFromXP(xp);
    const t = [0, 0, 100, 300, 600, 1000];
    return l <= 5 ? t[l] : 1500 + (l - 6) * 500;
}

let audioCtx = null;
function ensureAudioCtx() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
    }
    return audioCtx;
}
function playTone(freq, duration, type, vol) {
    if (!state.settings.soundEnabled) return;
    const ctx = ensureAudioCtx();
    if (!ctx) return;
    try {
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol || 0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch(e) {}
}

function confetti(count) {
    count = count || 80;
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:999;';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const colors = ['#fbbf24','#8b5cf6','#10b981','#ef4444','#f59e0b','#ec4899','#14b8a6','#fcd34d'];
    const particles = [];
    for (let i = 0; i < count; i++) {
        particles.push({
            x: canvas.width/2, y: canvas.height/2,
            vx: (Math.random()-0.5)*14, vy: (Math.random()-0.5)*14-5,
            size: Math.random()*6+4,
            color: colors[Math.floor(Math.random()*colors.length)],
            rot: Math.random()*Math.PI*2, vrot: (Math.random()-0.5)*0.3, life:1
        });
    }
    function frame() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        let active = false;
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.35;
            p.rot += p.vrot; p.life -= 0.012;
            if (p.life > 0) {
                active = true;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();
            }
        });
        if (active) requestAnimationFrame(frame);
        else canvas.remove();
    }
    frame();
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function escapeAttr(s) {

function setupTracing() {
    const c = document.getElementById('traceCanvas');
    if (!c) return;
    const ctx = c.getContext('2d');
    ctx.strokeStyle = '#8b5cf6';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    let drawing = false, lx = 0, ly = 0;
    const getPos = (e) => {
        const r = c.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (c.width / r.width), y: (e.clientY - r.top) * (c.height / r.height) };
    };
    c.addEventListener('pointerdown', (e) => {
        e.preventDefault(); drawing = true;
        const p = getPos(e); lx = p.x; ly = p.y;
        try { c.setPointerCapture(e.pointerId); } catch(_) {}
    });
    c.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        e.preventDefault();
        const p = getPos(e);
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p.x, p.y); ctx.stroke();
        lx = p.x; ly = p.y;
    });
    c.addEventListener('pointerup', () => drawing = false);
    c.addEventListener('pointercancel', () => drawing = false);
}
function clearTrace() {
    const c = document.getElementById('traceCanvas');
    if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

/* ============ PRIÈRE & BOUSSOLE ============ */
let practiceStep = 0;
let qiblaHeading = 0;
let deviceHeading = 0;

function getQiblaAngle(lat, lon) {
    const kaabaLat = 21.4225 * Math.PI / 180;
    const kaabaLon = 39.8262 * Math.PI / 180;
    const userLat = lat * Math.PI / 180;
    const userLon = lon * Math.PI / 180;
    const y = Math.sin(kaabaLon - userLon);
    const x = Math.cos(userLat) * Math.tan(kaabaLat) - Math.sin(userLat) * Math.cos(kaabaLon - userLon);
    let qibla = Math.atan2(y, x) * 180 / Math.PI;
    return qibla;
}

function initCompass() {
    const compassNeedle = document.getElementById('compass-needle');
    const compassInfo = document.getElementById('compass-info');
    
    if (!navigator.geolocation) {
        if (compassInfo) compassInfo.innerHTML = "⚠️ GPS non supporté par cet appareil.";
        return;
    }

    navigator.geolocation.getCurrentPosition((pos) => {
        const qibla = getQiblaAngle(pos.coords.latitude, pos.coords.longitude);
        qiblaHeading = qibla;
        
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
            
            // iOS requires permission
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                if (compassInfo) compassInfo.innerHTML = `<button class="btn btn-gold btn-sm" onclick="requestCompassPermission()">🧭 Activer la boussole</button>`;
            } else {
                if (compassInfo) compassInfo.innerHTML = `📍 Qibla : <span>${Math.round(qibla)}°</span> depuis le Nord`;
            }
        } else {
            if (compassInfo) compassInfo.innerHTML = `📍 Qibla : <span>${Math.round(qibla)}°</span> (Boussole non supportée)`;
        }
    }, (err) => {
        if (compassInfo) compassInfo.innerHTML = "⚠️ Activez la localisation pour voir la Qibla.";
    }, { enableHighAccuracy: true });
}

function requestCompassPermission() {
    DeviceOrientationEvent.requestPermission().then(response => {
        if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            const compassInfo = document.getElementById('compass-info');
            if (compassInfo) compassInfo.innerHTML = `📍 Qibla : <span>${Math.round(qiblaHeading)}°</span> depuis le Nord`;
        }
    }).catch(console.error);
}

function handleOrientation(event) {
    let heading = event.webkitCompassHeading || event.alpha;
    if (heading === null || heading === undefined) return;
    
    deviceHeading = heading;
    const compassNeedle = document.getElementById('compass-needle');
    
    if (compassNeedle) {
        // On fait pivoter l'aiguille pour qu'elle pointe vers la Qibla
        // Si l'appareil tourne à droite (heading augmente), l'aiguille tourne à gauche
        const rotation = qiblaHeading - deviceHeading;
        compassNeedle.style.transform = `rotate(${rotation}deg)`;
    }
}

function markPrayerStepSeen(idx) {

function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'qurania-sauvegarde-' + todayKey() + '.json'; a.click();
    URL.revokeObjectURL(url);
    showToast('📤 Sauvegarde exportée');
}
function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const imported = JSON.parse(e.target.result);
            state = { ...defaultState, ...imported,
                stats: { ...defaultState.stats, ...(imported.stats || {}) },
                settings: { ...defaultState.settings, ...(imported.settings || {}) },
                vocabSRS: imported.vocabSRS || {},
                prayerStepsSeen: imported.prayerStepsSeen || [] };
            saveState();
            applyTheme();
            updateHeader();
            renderSettings();
            showToast('✅ Sauvegarde restaurée !');
        } catch (err) { showToast('❌ Fichier invalide'); }
    };
    reader.readAsText(file);
}

    if (!confirm('⚠️ Effacer toute ta progression ?')) return;

    state = JSON.parse(JSON.stringify(defaultState));

}

let currentQuiz = null, combo = 0;
function buildQuestions(type, n) {
    n = n || 10;
    const qs = [];
    const incLetters = (type === 'letters' || type === 'mix');
    const incVocab = (type === 'vocab' || type === 'mix');
    const incVerses = (type === 'verses' || type === 'mix');
    const incNumbers = (type === 'numbers' || type === 'mix');
    const incDuas = (type === 'duas' || type === 'mix');
    const incPrayer = (type === 'prayer');

    if (incLetters) {
        const cnt = type === 'mix' ? 3 : n;
        shuffle(LETTERS.map((_, i) => i)).slice(0, cnt).forEach(i => {
            const correct = LETTERS[i].name;
            const wrong = shuffle(LETTERS.filter((_, j) => j !== i).map(l => l.name)).slice(0, 3);
            qs.push({ kind:'letter', question:LETTERS[i].ar, hint:"Quel est le nom de cette lettre ?", options: shuffle([correct, ...wrong]), answer: correct });
        });
    }
    if (incVocab) {
        const cnt = type === 'mix' ? 3 : n;
        shuffle(VOCAB.map((_, i) => i)).slice(0, cnt).forEach(i => {
            const correct = VOCAB[i].fr;
            const wrong = shuffle(VOCAB.filter((_, j) => j !== i).map(v => v.fr)).slice(0, 3);
            qs.push({ kind:'vocab', question:VOCAB[i].ar, hint:"Que signifie ce mot ?", options: shuffle([correct, ...wrong]), answer: correct, translit: VOCAB[i].tr });
        });
    }
    if (incVerses) {
        const cnt = type === 'mix' ? 2 : n;
        const all = [];
        SURAHS.forEach(s => s.verses.forEach((v, vi) => all.push({ s, v, vi })));
        shuffle(all).slice(0, cnt).forEach(({ s, v, vi }) => {
            const w = v.ar.split(/\s+/);
            if (w.length < 3) return;
            const hi = Math.floor(Math.random() * w.length);
            const hidden = w[hi];
            const disp = w.slice(); disp[hi] = '____';
            const otherW = all.filter(x => x.v.ar !== v.ar).reduce((a, x) => a.concat(x.v.ar.split(/\s+/)), []).filter(x => x !== hidden && x.length > 1);
            const uniq = [...new Set(otherW)];
            const wrong = shuffle(uniq).slice(0, 3);
            if (wrong.length < 3) return;
            qs.push({ kind:'verse', question:disp.join(' '), hint:s.name + ', v.' + (vi+1) + ' — Quel mot ?', options: shuffle([hidden, ...wrong]), answer: hidden });
        });
    }
    if (incNumbers) {
        const cnt = type === 'mix' ? 2 : n;
        shuffle(NUMBERS.map((_, i) => i)).slice(0, cnt).forEach(i => {
            const correct = NUMBERS[i].fr;
            const wrong = shuffle(NUMBERS.filter((_, j) => j !== i).map(x => x.fr)).slice(0, 3);
            qs.push({ kind:'number', question:NUMBERS[i].ar, hint:"Quel nombre ?", options: shuffle([correct, ...wrong]), answer: correct });
        });
    }
    if (incDuas) {
        const cnt = type === 'mix' ? 2 : n;
        shuffle(DUAS.map((_, i) => i)).slice(0, cnt).forEach(i => {
            const correct = DUAS[i].fr;
            const wrong = shuffle(DUAS.filter((_, j) => j !== i).map(d => d.fr)).slice(0, 3);
            qs.push({ kind:'dua', question:DUAS[i].ar, hint:"Que signifie cette invocation ?", options: shuffle([correct, ...wrong]), answer: correct, translit: DUAS[i].tr });
        });
    }
    if (incPrayer) {
        const withR = PRAYER_STEPS.filter(s => s.recite.ar);
        shuffle(withR.map((_, i) => i)).slice(0, n).forEach(i => {
            const step = withR[i];
            const correct = step.recite.fr;
            const wrong = shuffle(withR.filter((_, j) => j !== i).map(s => s.recite.fr)).slice(0, 3);
            if (wrong.length < 3) return;
            qs.push({ kind:'prayer', question:step.recite.ar, hint:"Que dit-on pendant : " + step.title + " ?", options: shuffle([correct, ...wrong]), answer: correct, translit: step.recite.tr });
        });
        const pos = [
            { q:"Position pour « Subhana rabbiyal adhim » ?", a:"Ruku (inclinaison)", w:["Sujud", "Qiyam", "Julus"] },
            { q:"Position pour « Subhana rabbiyal a'la » ?", a:"Sujud (prosternation)", w:["Ruku", "Qiyam", "Tashahhud"] },
            { q:"Rak'a de Fajr ?", a:"2", w:["3", "4", "5"] },
            { q:"Rak'a de Maghrib ?", a:"3", w:["2", "4", "5"] },
            { q:"Rak'a de Dhuhr ?", a:"4", w:["2", "3", "5"] },
            { q:"Première étape de la prière ?", a:"Takbir", w:["Ruku", "Fatiha", "Sujud"] },
            { q:"Que dit-on en se prosternant ?", a:"Subhana rabbiyal a'la", w:["Subhana rabbiyal adhim", "Allahu Akbar", "Rabbighfir li"] },
            { q:"Salutation finale ?", a:"As-salamu alaykum wa rahmatullah", w:["Allahu Akbar", "Al-hamdu lillah", "SubhanAllah"] }
        ];
        shuffle(pos).slice(0, 4).forEach(p => {
            qs.push({ kind:'prayer-qa', question:p.q, hint:"Connaissance de la prière", options: shuffle([p.a, ...p.w]), answer: p.a });
        });
    }
    return shuffle(qs).slice(0, n);
}
function startQuiz(type) {
    stopCurrentAudio();
    const questions = buildQuestions(type, 10);
    if (!questions.length) { showToast('Pas assez de contenu'); return; }
    combo = 0;
    currentQuiz = { type, questions, index: 0, score: 0 };
    renderQuiz();
}
function startDailyChallenge() {
    if (state.lastDailyChallenge === todayKey()) { showToast('✅ Défi déjà terminé !'); return; }
    switchView('exercises');
    setTimeout(() => {
        combo = 0;
        currentQuiz = { type:'daily', questions:buildQuestions('mix', 5), index:0, score:0, isDaily:true };
        renderQuiz();
    }, 200);
}
function renderQuiz() {
    const area = document.getElementById('quiz-area');
    if (!currentQuiz) return;
    if (currentQuiz.index >= currentQuiz.questions.length) { renderQuizResult(); return; }
    const q = currentQuiz.questions[currentQuiz.index];
    const total = currentQuiz.questions.length;
    let qHTML = '';
    if (q.kind === 'letter') qHTML = '<div class="big">' + q.question + '</div>';
    else if (q.kind === 'vocab' || q.kind === 'number' || q.kind === 'dua' || q.kind === 'prayer') {
        qHTML = '<div class="big">' + q.question + '</div>';
        if (q.translit) qHTML += '<div style="color:var(--text-dim); font-style:italic; font-size:0.85rem;">' + q.translit + '</div>';
    } else if (q.kind === 'verse') {
        qHTML = '<div style="font-family:\'Amiri\',serif; font-size:1.7rem; color:var(--gold); direction:rtl; line-height:1.8; margin-bottom:0.6rem;">' + q.question + '</div>';
    } else if (q.kind === 'prayer-qa') {
        qHTML = '<div style="font-size:1.05rem; line-height:1.5;">' + q.question + '</div>';
    }
    const comboHTML = combo >= 2 ? `<span class="combo-indicator">🔥 ×${combo}</span>` : '';
    area.innerHTML = `
        <div class="quiz-panel">
            <div class="quiz-progress">
                <span>${currentQuiz.isDaily ? '🌅 Défi — ' : ''}Q${currentQuiz.index + 1}/${total} ${comboHTML}</span>
                <span>Score : ${currentQuiz.score} ⭐</span>
            </div>
            <div class="progress-bar" style="margin-bottom:1rem;">
                <div class="progress-fill" style="width:${(currentQuiz.index / total) * 100}%"></div>
            </div>
            <div class="quiz-question">
                ${qHTML}
                <div class="hint" style="margin-top:0.8rem;">${q.hint || ''}</div>
            </div>
            <div class="quiz-options">
                ${q.options.map(o => `<button class="quiz-option" data-answer="${escapeAttr(o)}">${escapeHTML(o)}</button>`).join('')}
            </div>
            <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
    `;
    area.querySelectorAll('.quiz-option').forEach(btn => {
        btn.addEventListener('click', () => answerQuiz(btn.getAttribute('data-answer'), btn));
    });
}
function answerQuiz(choice, btn) {
    const q = currentQuiz.questions[currentQuiz.index];
    const opts = document.querySelectorAll('.quiz-option');
    opts.forEach(o => o.disabled = true);
    const correct = choice === q.answer;
    if (correct) {
        btn.classList.add('correct');
        currentQuiz.score++;
        state.stats.correct++;
        combo++;
        saveState();
        let bonus = 10;
        if (combo === 3) bonus = 15;
        else if (combo >= 5) bonus = 20;
        else if (combo >= 2) bonus = 12;
        addXP(bonus, combo >= 3 ? 'Combo ×' + combo + ' !' : 'Bonne réponse');
        playSoundCorrect();
        document.getElementById('quiz-feedback').textContent = combo >= 3 ? '🔥 Combo ! Bonne réponse !' : '✅ Bonne réponse !';
        document.getElementById('quiz-feedback').className = 'quiz-feedback ok';
    } else {
        btn.classList.add('wrong');
        state.stats.wrong++;
        combo = 0;
        opts.forEach(o => { if (o.getAttribute('data-answer') === q.answer) o.classList.add('correct'); });
        saveState();
        playSoundWrong();
        document.getElementById('quiz-feedback').textContent = '❌ Réponse : ' + q.answer;
        document.getElementById('quiz-feedback').className = 'quiz-feedback ko';
    }
    updateHeader();
    setTimeout(() => { currentQuiz.index++; renderQuiz(); }, 1400);
}
function renderQuizResult() {
    const area = document.getElementById('quiz-area');
    const total = currentQuiz.questions.length;
    const score = currentQuiz.score;
    const pct = Math.round((score / total) * 100);
    const perfect = score === total;
    if (!state.stats.history) state.stats.history = [];
    state.stats.history.push({ date: Date.now(), type: currentQuiz.isDaily ? 'daily' : currentQuiz.type, score, total });
    if (state.stats.history.length > 100) state.stats.history = state.stats.history.slice(-100);
    if (perfect) { awardBadge('perfect-quiz'); confetti(100); }
    awardBadge('first-quiz');
    if (currentQuiz.isDaily) {
        state.lastDailyChallenge = todayKey();
        if (score >= 3) addXP(50, 'Défi du jour !');
    }
    saveState();
    let emoji = '😊', title = 'Pas mal !';
    if (pct === 100) { emoji = '🏆'; title = 'Parfait !'; }
    else if (pct >= 80) { emoji = '🎉'; title = 'Excellent !'; }
    else if (pct >= 60) { emoji = '👍'; title = 'Bien joué !'; }
    else if (pct >= 40) { emoji = '💪'; title = 'Continue !'; }
    else { emoji = '📚'; title = 'À réviser'; }
    area.innerHTML = `
        <div class="quiz-panel result-panel">
            <div class="big-emoji">${emoji}</div>
            <div class="result-title">${title}</div>
            <div class="result-score">${score} / ${total} (${pct}%)</div>
            ${currentQuiz.isDaily ? '<p style="color:var(--gold); margin-bottom:1rem;">🌅 Défi du jour terminé !</p>' : ''}
            <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
                <button class="btn btn-gold" id="replay-btn">🔄 Rejouer</button>
                <button class="btn btn-ghost" onclick="switchView('exercises')">← Autres exercices</button>
            </div>
        </div>
    `;
    document.getElementById('replay-btn').addEventListener('click', () => {
        startQuiz(currentQuiz.isDaily ? 'mix' : currentQuiz.type);
    });
    updateMascotTip(pct >= 80 ? "🎉 Excellent ! Continue comme ça !" : pct >= 50 ? "👍 Bien joué, continue !" : "💪 N'abandonne pas !");
}

(function init() {
    applyTheme();
    updateStreak();
    checkBadges();
    updateHeader();
    renderHome();
    initVoices();
    document.getElementById('modal').addEventListener('click', e => {
        if (e.target.id === 'modal') closeModal();
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
    });
    setInterval(() => {
        if (Math.random() < 0.15) {
            updateMascotTip(MASCOT_TIPS[Math.floor(Math.random() * MASCOT_TIPS.length)]);
        }
    }, 12000);
    saveState();
})();
</script>
<script>
  if (typeof navigator.serviceWorker !== 'undefined') {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
